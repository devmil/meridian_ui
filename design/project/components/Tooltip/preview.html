<!doctype html>
<html>
<head><meta charset="utf-8"><title>Tooltip · Meridian</title></head>
<body>
<div id="root"></div>
<script>
var M = window.Meridian, h = React.createElement;
function mount(el) { ReactDOM.createRoot(document.getElementById('root')).render(el); }
mount(h('div', { className: 'mr-demo pane', style: { alignItems: 'flex-start', flexDirection: 'column', gap: 6 } },
  h(M.IconButton, { icon: 'refresh-cw', label: 'Fetch' }),
  h(M.Tooltip, null, 'Fetch from origin')));
</script>
</body>
</html>
