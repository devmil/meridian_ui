name: meridian_ui
description: >-
  Meridian, the shared design system for Michael Lamers' Flutter apps
  (GitLama, CrossProton, Mimameidr, Nibluma): tokens, per-app brands and
  the primitive widgets, for desktop and touch.
version: 1.18.0
publish_to: 'none'

environment:
  sdk: ^3.9.0
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/icons/
    - assets/fonts/OFL.txt
  fonts:
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
