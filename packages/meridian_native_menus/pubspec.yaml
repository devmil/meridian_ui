name: meridian_native_menus
description: >-
  Meridian's companion for apps that show the operating system's native
  menus: a MeridianMenuPresenter that renders MeridianMenuEntry models as
  native context and action menus on macOS, Windows and Linux, and a native
  text-editing context menu.
version: 1.0.1
publish_to: 'none'

environment:
  sdk: ^3.9.0
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  meridian_ui:
    path: ../..
  super_context_menu: ^0.9.1
  super_native_extensions: ^0.9.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      macos:
        pluginClass: MeridianNativeMenusPlugin
      windows:
        pluginClass: MeridianNativeMenusPluginCApi
